<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FarmFreshFarmer — Instant Farm-Fresh Delivery in Visakhapatnam</title>
    <meta name="description" content="FarmFreshFarmer delivers fresh fruits, vegetables, homemade sweets, namkeen, pickles, millets, pulses and spices to your door in Visakhapatnam. Instant delivery, naturally fresh." />
    <meta property="og:title" content="FarmFreshFarmer — Instant Farm-Fresh Delivery" />
    <meta property="og:description" content="Fresh from the farm to your door in Visakhapatnam." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        // Hash router backward compatibility
        if (window.location.hash && window.location.hash.startsWith('#/') && window.location.hash.length > 2) {
          var cleanPath = window.location.hash.substring(1);
          window.history.replaceState(null, '', cleanPath);
        }

        // Auto-recover from stale chunks/MIME type errors when a new build is deployed
        function handleChunkError(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          var target = e && e.target;
          var targetSrc = (target && target.src) ? String(target.src) : '';
          var isScriptOrCss = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          
          var isChunkErr = msg.indexOf('MIME type') !== -1 || 
                           msg.indexOf('dynamically imported module') !== -1 || 
                           msg.indexOf('Importing a module script failed') !== -1 ||
                           msg.indexOf('Failed to load module script') !== -1 ||
                           msg.indexOf('Loading chunk') !== -1 ||
                           msg.indexOf('Failed to fetch') !== -1 ||
                           msg.indexOf('404') !== -1 ||
                           (isScriptOrCss && targetSrc.indexOf('/assets/') !== -1) ||
                           (target && target.tagName === 'SCRIPT');
          
          if (isChunkErr) {
            var reloadKey = 'fff_chunk_reload_ts';
            var lastReload = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
            if (Date.now() - lastReload > 2000) {
              sessionStorage.setItem(reloadKey, String(Date.now()));
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  names.forEach(function(name) { caches.delete(name); });
                }).finally(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            }
          }
        }

        window.addEventListener('vite:preloadError', function(event) {
          if (event && event.preventDefault) event.preventDefault();
          handleChunkError({ message: 'dynamically imported module failed' });
        });

        window.addEventListener('error', handleChunkError, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason) handleChunkError({ message: e.reason.message || String(e.reason) });
        });
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
