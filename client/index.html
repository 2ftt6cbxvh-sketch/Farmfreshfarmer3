<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FarmFreshFarmer — Instant Farm-Fresh Delivery in Visakhapatnam</title>
    <meta name="description" content="FarmFreshFarmer delivers fresh fruits, vegetables, homemade sweets, namkeen, pickles, millets, pulses and spices to your door in Visakhapatnam. Instant delivery, naturally fresh." />
    <meta property="og:title" content="FarmFreshFarmer — Instant Farm-Fresh Delivery" />
    <meta property="og:description" content="Fresh from the farm to your door in Visakhapatnam." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        // Hash router backward compatibility
        if (window.location.hash && window.location.hash.startsWith('#/') && window.location.hash.length > 2) {
          var cleanPath = window.location.hash.substring(1);
          window.history.replaceState(null, '', cleanPath);
        }

        // Auto-recover from stale chunks/MIME type errors when a new build is deployed
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          var targetSrc = (e && e.target && e.target.src) ? String(e.target.src) : '';
          var isChunkErr = msg.indexOf('MIME type') !== -1 || 
                           msg.indexOf('dynamically imported module') !== -1 || 
                           msg.indexOf('Loading chunk') !== -1 ||
                           msg.indexOf('Failed to fetch') !== -1 ||
                           (e.target && e.target.tagName === 'SCRIPT' && targetSrc.indexOf('/assets/') !== -1);
          
          if (isChunkErr) {
            var reloadKey = 'fff_chunk_reload_ts';
            var lastReload = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
            if (Date.now() - lastReload > 6000) {
              sessionStorage.setItem(reloadKey, String(Date.now()));
              window.location.reload();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
